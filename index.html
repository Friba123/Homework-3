<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Friba Movie Theater</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
         <section class="theater-box">
        <h1>Welcome to Dark Movie! 🎬☕</h1>
          <p class="note">Now Playing: My favorite Movie</p>
            <video controls>
                <source src="./media/trailer.mp4" type="video/mp4">
            </video>
            <div class="button-group">
                <button class="button">Play Again</button>
                <button class="button">Rate Movie</button>
            </div>
        </section>
    </body>
</html>
